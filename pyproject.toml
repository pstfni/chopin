[project]
name = "chopin"
version = "1.1.0"
description = "chopin: compose, download, and describe Spotify playlists"
authors = [{name="pstfni", email="x@y.com"}]
readme = "README.md"
requires-python = ">= 3.12"
classifiers = ["Private :: Do Not Upload"]

dependencies = [
    "emoji",
    "ruamel.yaml",
    "spotipy",
    "pydantic",
    "pydantic_settings",
    "coloredlogs",
    "click",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-sugar", "ruff",]
docs = ["zensical", "mkdocstrings", "mkdocstrings-python"]
app = ["streamlit",]

[tool.uv]
package = true

# Pin public PyPI as the default index. Prevents a user-level uv config (corporate mirror)
# from leaking into uv.lock during local builds.
[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true

[tool.setuptools.packages.find]
include = ["chopin*"]
namespaces = false

[project.scripts]
chopin = "chopin.cli:app"

