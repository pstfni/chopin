[tools]
python = "3.13"
uv = "latest"

[tasks.install]
description = "Install project dependencies"
run = "uv sync"

[tasks.touch-env]
description = "Create .env file if it doesn't exist"
run = "touch .env"

[tasks.setup]
description = "Full project setup (install deps + create .env)"
depends = ["install", "touch-env"]

[tasks.check]
description = "Verify the installation works (prints your Spotify user info)"
run = "uv run python scripts/check_install.py"

[tasks.docs]
description = "Install docs dependencies (if needed) and build the documentation"
run = [
    "uv sync --extra docs",
    "uv run zensical build --clean",
]

[tasks.test]
description = "Install dev dependencies (if needed) and run the test suite"
run = [
    "uv sync --extra dev",
    "uv run pytest",
]

[tasks.bootstrap-token]
description = "Authorize with Spotify once and print a refresh token for headless deployments"
run = "uv run python scripts/bootstrap_token.py"

[tasks.app]
description = "Run the Streamlit app locally"
run = [
    "uv sync --extra app",
    "uv run streamlit run app/main.py",
]

[tasks.lock]
description = "Generate uv.lock (required before docker build; the file is untracked)"
run = "uv lock"

[tasks.docker-build]
description = "Build the app's container image"
depends = ["lock"]
run = "docker build -t chopin ."

[tasks.docker-run]
description = "Run the app's container image locally, on http://localhost:8501"
run = "docker run --rm -p 8501:8501 --env-file .env chopin"
