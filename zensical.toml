[project]
site_name = "Chopin"
site_description = "Manage and compose Spotify playlists"
site_author = "pstfni"
site_url = "https://pstfni.github.io/chopin"
repo_url = "https://github.com/pstfni/chopin"
repo_name = "pstfni/chopin"

docs_dir = "docs"

extra_css = [".docs_theme/assets/stylesheets/custom.css"]

watch = [
    "chopin/managers/",
    "chopin/schemas/",
    "chopin/cli/",
]

nav = [
  { "Introduction" = ["index.md", "getting_started.md"] },
  { "Guide" = [
    { "🤖 Compose a playlist" = ["guide/compose.md", "guide/sources.md"] },
    "guide/queue.md",
    "guide/shuffle.md",
    "guide/backup_and_restore.md",
    "guide/doppelganger.md"
  ] },
  { "Reference" = [
    "reference/index.md",
    "reference/entrypoints.md",
    "reference/managers.md",
    "reference/client.md",
    "reference/schemas.md",
    "reference/tools.md",
    "reference/sources.md"
  ] }
]

[project.theme]
language = "en"
features = [
    "content.action.edit",
    "content.action.view",
    "content.code.annotate",
    "content.code.copy",
    "content.code.select",
    "content.footnote.tooltips",
    "content.tabs.link",
    "content.tooltips",
    "navigation.footer",
    "navigation.indexes",
    "navigation.instant",
    "navigation.instant.prefetch",
    "navigation.path",
    "navigation.sections",
    "navigation.top",
    "navigation.tracking",
    "search.highlight",
]

[project.theme.icon]
repo = "fontawesome/brands/github"

[[project.theme.palette]]
scheme = "default"
primary = "green"
accent = "green"
media = "(prefers-color-scheme: light)"
toggle.icon = "lucide/moon"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
primary = "green"
accent = "green"
media = "(prefers-color-scheme: dark)"
toggle.icon = "lucide/sun"
toggle.name = "Switch to light mode"

[project.markdown_extensions.tables]
[project.markdown_extensions.admonition]
[project.markdown_extensions.abbr]
[project.markdown_extensions.footnotes]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.attr_list]

[project.markdown_extensions."pymdownx.highlight"]
anchor_linenums = true

[project.markdown_extensions."pymdownx.inlinehilite"]
[project.markdown_extensions."pymdownx.snippets"]
[project.markdown_extensions."pymdownx.superfences"]
[project.markdown_extensions."pymdownx.details"]

[project.markdown_extensions."pymdownx.tasklist"]
custom_checkbox = true

[project.plugins.search]

[project.plugins.mkdocstrings.handlers.python]
inventories = ["https://docs.python.org/3/objects.inv"]
paths = ["chopin/"]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "google"
inherited_members = true
show_source = false
