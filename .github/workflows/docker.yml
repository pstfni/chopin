name: Docker image
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build-and-push:
    name: Build and push the image to ECR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Spec 3: generate uv.lock in CI. The file is untracked locally (.git/info/exclude: *.lock).
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: false
      - run: uv lock

      # QEMU is only needed when building a non-native architecture.
      # Remove this step if switching to linux/amd64 (native on ubuntu-latest runners).
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      # Authenticate to AWS with GitHub OIDC. No long-lived keys stored in GitHub.
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # Log in to ECR. The registry is <account>.dkr.ecr.<region>.amazonaws.com.
      - id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.login-ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          # linux/arm64 for t4g (Graviton) instances. Switch to linux/amd64 for t3.
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
